  { cau: "Quan niệm cho rằng 'Óc tiết ra ý thức như gan tiết ra mật' là của trường phái triết học nào?", a: "Chủ nghĩa duy vật siêu hình.", b: "Chủ nghĩa duy vật biện chứng.", c: "Chủ nghĩa duy vật chất phác.", d: "Chủ nghĩa duy vật tầm thường.", dung: "D" },
  { cau: "Ý thức là hình ảnh chủ quan của thế giới khách quan là quan niệm của trường phái triết học nào?", a: "Chủ nghĩa duy vật tầm thường.", b: "Chủ nghĩa duy vật chất phác.", c: "Chủ nghĩa duy vật siêu hình.", d: "Chủ nghĩa duy vật biện chứng.", dung: "D" },
  { cau: "Trường phái triết học nào cho rằng thực tiễn là cơ sở chủ yếu và trực tiếp nhất của nhận thức?", a: "Chủ nghĩa duy tâm chủ quan.", b: "Chủ nghĩa duy vật biện chứng.", c: "Chủ nghĩa duy vật siêu hình.", d: "Chủ nghĩa duy tâm khách quan.", dung: "B" },
  { cau: "Theo quan điểm của chủ nghĩa duy vật biện chứng, sự phát triển của các sự vật, hiện tượng có tính chất gì?", a: "Tính ngẫu nhiên, chủ quan.", b: "Tính khách quan, đa dạng.", c: "Tính khách quan, tính phổ biến, tính kế thừa.", d: "Tính khách quan, tính phổ biến, tính kế thừa, tính đa dạng, phong phú.", dung: "D" },
  { cau: "Các hình thức tồn tại của vật chất?", a: "Vận động, không gian và thời gian", b: "Phát triển, không gian và thời gian", c: "Vận động, phát triển, không gian và thời gian", d: "Chuyển động, không gian và thời gian", dung: "A" },
  { cau: "Nhận thức lý tính đem lại cho con người tri thức gì?", a: "Cảm tính.", b: "Thông thường.", c: "Kinh nghiệm.", d: "Lý luận.", dung: "D" },
  { cau: "Theo quan niệm của chủ nghĩa duy vật biện chứng, các mặt đối lập do đâu mà có?", a: "Vốn có của thế giới vật chất, không do ai sinh ra.", b: "Do quá trình lao động của con người sinh ra.", c: "Do các đấng siêu nhiên tạo ra.", d: "Do ý thức, cảm giác của con người tạo ra.", dung: "A" },
  { cau: "Quan điểm cho rằng: 'Chúng ta chỉ nhận thức được các cảm giác của chúng ta thôi' của trường phái triết học nào?", a: "Chủ nghĩa duy tâm khách quan", b: "Chủ nghĩa duy tâm chủ quan", c: "Chủ nghĩa hoài nghi", d: "Thuyết không thể biết", dung: "B" },
  { cau: "'Cơ sở của mối liên hệ giữa các sự vật hiện tượng là ở tính thống nhất vật chất của thế giới'. Luận điểm trên thuộc trường phái triết học nào?", a: "Chủ nghĩa duy vật siêu hình.", b: "Chủ nghĩa duy vật biện chứng.", c: "Chủ nghĩa duy vật chất phác.", d: "Chủ nghĩa duy tâm khách quan.", dung: "B" },
  { cau: "Theo quan điểm của triết học Mác - Lênin, mục đích của nhận thức là gì?", a: "Phục vụ nhu cầu thực tiễn của con người", b: "Thỏa mãn sự hiểu biết của con người", c: "Giúp con người hiểu bản chất của mình", d: "Phục vụ hoạt động sản xuất", dung: "A" },
  { cau: "Hoạt động thực tiễn khác với hoạt động nhận thức ở tính chất nào?", a: "Tính mục đích.", b: "Tính xã hội.", c: "Tính lịch sử.", d: "Tính vật chất.", dung: "D" },
  { cau: "Theo quan niệm của V.I.Lênin: Vật chất là một phạm trù triết học dùng để chỉ cái gì?", a: "Thế giới.", b: "Thực tại khách quan.", c: "Một khái niệm.", d: "Đối tượng.", dung: "B" },
  { cau: "Chọn phương án đúng nhất từ ý nghĩa phương pháp luận phạm trù tất nhiên và ngẫu nhiên?", a: "Trong hoạt động thực tiễn, chúng ta cần phải dựa vào cái ngẫu nhiên.", b: "Trong hoạt động thực tiễn, chúng ta cần phải dựa vào cái tất nhiên nhưng phải tính tới ngẫu nhiên.", c: "Trong hoạt động thực tiễn, chúng ta cần phải dựa vào cái tất nhiên.", d: "Trong hoạt động thực tiễn, chúng ta cần phải dựa vào cả cái tất nhiên và ngẫu nhiên.", dung: "B" },
  { cau: "Tính chất đặc trưng của phép biện chứng mác xít là gì?", a: "Chất phác.", b: "Chủ quan.", c: "Duy tâm.", d: "Duy vật.", dung: "D" },
  { cau: "Luận điểm của Lênin: 'Muốn thực sự hiểu được sự vật cần phải nhìn bao quát và nghiên cứu tất cả các mặt, tất cả các mối liên hệ và quan hệ gián tiếp của vật đó', thể hiện quan điểm nào trong nhận thức?", a: "Quan điểm phát triển.", b: "Quan điểm lịch sử - cụ thể.", c: "Quan điểm toàn diện.", d: "Quan điểm khách quan.", dung: "C" },
  { cau: "Nội dung thể hiện tính thống nhất vật chất của thế giới?", a: "Chỉ có một thế giới duy nhất và đồng nhất về thế giới vật chất - thế giới tồn tại chủ quan, có trước và độc lập với ý thức con người, được ý thức con người phản ánh. Mọi bộ phận của thế giới có mối quan hệ vật chất thống nhất với nhau", b: "Chỉ có một thế giới duy nhất và đồng nhất về thế giới vật chất - thế giới tồn tại khách quan, có sau và độc lập với ý thức con người, được ý thức con người phản ánh. Mọi bộ phận của thế giới có mối quan hệ vật chất thống nhất với nhau", c: "Chỉ có một thế giới duy nhất và đồng nhất về thế giới vật chất - thế giới tồn tại khách quan, có trước và phụ thuộc với ý thức con người, được ý thức con người phản ánh. Mọi bộ phận của thế giới có mối quan hệ vật chất thống nhất với nhau", d: "Chỉ có một thế giới duy nhất và đồng nhất về thế giới vật chất - thế giới tồn tại khách quan, có trước và độc lập với ý thức con người, được ý thức con người phản ánh. Mọi bộ phận của thế giới có mối quan hệ vật chất thống nhất với nhau", dung: "D" },
  { cau: "Nhận định nào về phủ định biện chứng là KHÔNG đúng?", a: "Phủ định có tính kế thừa.", b: "Phủ định đồng thời cũng là khẳng định.", c: "Phủ định có tính khách quan, phổ biến.", d: "Phủ định là chấm dứt sự phát triển.", dung: "D" },
  { cau: "Luận điểm nào dưới đây thể hiện quan điểm duy vật biện chứng về không gian (KG) và thời gian (TG)?", a: "KG và TG là sản phẩm thuần túy của tư duy.", b: "KG chứa các sự vật, TG chứa các sự kiện.", c: "KG và TG không phụ thuộc vật chất.", d: "KG và TG là hình thức tồn tại của vật chất.", dung: "D" },
  { cau: "Phạm trù triết học nào dùng để chỉ quá trình vận động từ đơn giản đến phức tạp, từ kém hoàn thiện đến hoàn thiện hơn của sự vật?", a: "Phát triển", b: "Mâu thuẫn", c: "Biện chứng", d: "Phủ định", dung: "A" },
  { cau: "Vì sao vật chất quyết định nội dung phản ánh của ý thức?", a: "Bản chất của ý thức là sự phản ánh chủ quan của hiện thực chủ quan. Hay nói cách khác, hiện thực khách quan (vật chất) là 'nguyên liệu đầu vào' của việc hình thành ý thức nên quyết định ý thức", b: "Bản chất của ý thức là sự phản ánh chủ quan của hiện thực khách quan. Hay nói cách khác, hiện thực khách quan (vật chất) là 'nguyên liệu đầu vào' của việc hình thành ý thức nên quyết định ý thức", c: "Bản chất của ý thức là sự phản ánh khách quan của hiện thực chủ quan. Hay nói cách khác, hiện thực khách quan (vật chất) là 'nguyên liệu đầu vào' của việc hình thành ý thức nên quyết định ý thức", d: "Bản chất của ý thức là sự phản ánh khách quan của hiện thực khách quan. Hay nói cách khác, hiện thực khách quan (vật chất) là 'nguyên liệu đầu vào' của việc hình thành ý thức nên quyết định ý thức", dung: "B" },
  { cau: "Ý thức phản ánh hiện thực vào óc người. Tại sao cùng một sự vật hiện tượng, mỗi người khác nhau lại có cách hiểu không giống nhau, thậm chí trái ngược nhau?", a: "Nội dung phản ánh của ý thức mang tính chủ quan, do thế giới khách quan quy định. Kết quả phản ánh ý thức mang tính khách quan của chủ thể phản ánh", b: "Nội dung phản ánh của ý thức mang tính khách quan, do thế giới khách quan quy định. Kết quả phản ánh của ý thức mang tính chủ quan của chủ thể phản ánh", c: "Nội dung phản ánh của ý thức mang tính chủ quan, do thế giới khách quan quy định. Kết quả phản ánh ý thức mang tính chủ quan của chủ thể phản ánh", d: "Nội dung phản ánh của ý thức mang tính khách quan, do thế giới khách quan quy định. Kết quả phản ánh ý thức mang tính chủ quan của chủ thể phản ánh", dung: "B" },
  { cau: "Quan niệm nào là đúng về 'chất' của sự vật?", a: "Một thuộc tính nổi bật của sự vật.", b: "Thuộc tính cơ bản của sự vật.", c: "Trình độ, quy mô của sự vật.", d: "Tổng hợp các thuộc tính cơ bản của sự vật", dung: "D" },
  { cau: "Người đưa ra định nghĩa hoàn chỉnh về vật chất là ai?", a: "Ph.Ăngghen.", b: "C.Mác.", c: "L.Phoiơbắc.", d: "V.I.Lênin.", dung: "D" },
  { cau: "Những nguyên tắc đòi hỏi trong nhận thức sự vật, cần phải đặt nó trong một không gian, thời gian, bối cảnh nhất định mà sự vật đó tồn tại gọi là gì?", a: "Quan điểm toàn diện.", b: "Quan điểm duy vật.", c: "Quan điểm phát triển.", d: "Quan điểm lịch sử - cụ thể.", dung: "D" },
  { cau: "Theo V.I.Lênin, vật chất là gì?", a: "Thực tại khách quan - cái tồn tại hiện thực bên ngoài ý thức và không lệ thuộc vào ý thức, tác động vào các giác quan con người đem lại cho con người cảm giác", b: "Tất cả mọi thứ xung quanh mà con người có thể cảm nhận được", c: "Một dạng thức đặc biệt của ý thức", d: "Thực tại khách quan - cái tồn tại hiện thực bên ngoài ý thức và lệ thuộc vào ý thức, tác động vào các giác quan con người đem lại cho con người cảm giác", dung: "A" },
  { cau: "Những yếu tố nào đóng vai trò quyết định trong sự hình thành biểu tượng?", a: "Ấn tượng, giấc mơ.", b: "Cảm giác, tri giác.", c: "Ấn tượng, trí nhớ.", d: "Trí nhớ, giấc mơ.", dung: "B" },
  { cau: "Trình độ nhận thức nào gián tiếp, trừu tượng, có tính hệ thống trong việc khái quát bản chất, quy luật của các sự vật, hiện tượng?", a: "Nhận thức thông thường.", b: "Nhận thức kinh nghiệm.", c: "Nhận thức khoa học.", d: "Nhận thức lý luận.", dung: "D" },
  { cau: "Theo triết học Mác - Lênin, sự tác động của ý thức đến vật chất được thể hiện thông qua hoạt động nào?", a: "Hoạt động lý luận.", b: "Hoạt động nghiên cứu khoa học.", c: "Hoạt động thực tiễn.", d: "Hoạt động tư duy của con người.", dung: "C" },
  { cau: "Hạn chế cơ bản trong quan niệm về vật chất của các nhà triết học duy vật cận đại là gì?", a: "Đồng nhất vật chất với khối lượng.", b: "Đồng nhất vật chất với sự vật cảm tính.", c: "Coi vật chất là những gì tồn tại khách quan", d: "Coi vật chất là tự thân vận động.", dung: "A" },
  { cau: "Quan niệm về vật chất của chủ nghĩa duy vật trước Mác là gì?", a: "Không có quan niệm về vật chất", b: "Thời cận đại: Đồng nghĩa vật chất với khối lượng", c: "Thời cổ đại: Đồng nghĩa vật chất với vật thể", d: "Thời cổ đại: Đồng nghĩa vật chất với vật thể. Thời cận đại: Đồng nghĩa vật chất với khối lượng", dung: "D" },
  { cau: "Theo quan điểm triết học Mác - Lênin, sự ra đời của ý thức có nguồn gốc sâu xa là gì?", a: "Bộ óc con người.", b: "Ngôn ngữ.", c: "Lao động.", d: "Sự phát triển của giới tự nhiên.", dung: "D" },
  { cau: "Khi viết: 'Loài vật giỏi lắm thì cũng chỉ biết hái lượm là cùng, con người thì biết sản xuất, con người chế tạo ra những tư liệu sinh sống' Ph.Ăngghen nhấn mạnh nhân tố gì đánh dấu sự khác biệt giữa con người với loài vật?", a: "Ngôn ngữ.", b: "Tâm lý.", c: "Bản năng.", d: "Ý thức.", dung: "D" },
  { cau: "Không gian và thời gian của hệ mặt trời là...", a: "Trường tồn", b: "Bất ổn định", c: "Vô hạn", d: "Hữu hạn", dung: "D" },
  { cau: "Hình thái nào KHÔNG thuộc nhận thức lý tính?", a: "Cảm giác.", b: "Suy luận.", c: "Khái niệm.", d: "Phán đoán.", dung: "A" },
  { cau: "Hoàn thiện luận điểm của Ph.Ăngghen: 'Phép biện chứng chẳng qua chỉ là môn khoa học về những … của sự vận động và phát triển thế giới'?", a: "quy luật phổ biến.", b: "quy luật chung.", c: "quy luật đặc thù.", d: "quy luật riêng.", dung: "A" },
  { cau: "Yếu tố nào sau đây KHÔNG phản ánh mối quan hệ giữa chủ thể và khách thể trong quá trình nhận thức?", a: "Đối tượng nhận thức.", b: "Khách thể nhận thức.", c: "Chủ thể nhận thức.", d: "Hình thức nhận thức.", dung: "D" },
  { cau: "Theo quan điểm của chủ nghĩa duy vật biện chứng, khái niệm là gì?", a: "Sự liên kết các tri giác.", b: "Hình thức nhận thức cảm tính.", c: "Hình thức tư duy trừu tượng.", d: "Sự liên kết các cảm giác.", dung: "C" },

let list = data.slice(), idx = 0, score = 0;

function show() {
  let item = list.at(idx);
  document.getElementById("num").innerText = "Câu " + (idx + 1) + "/" + list.length;
  document.getElementById("pts").innerText = "Điểm: " + score;
  document.getElementById("q").innerText = item.cau;
  document.getElementById("nxt").style.display = "none";
  
  document.getElementById("opts").innerHTML = `
    <button class="opt cA" id="btnA" onclick="pick('A')">A. ${item.a}</button>
    <button class="opt cB" id="btnB" onclick="pick('B')">B. ${item.b}</button>
    <button class="opt cC" id="btnC" onclick="pick('C')">C. ${item.c}</button>
    <button class="opt cD" id="btnD" onclick="pick('D')">D. ${item.d}</button>
  `;
}

function pick(chon) {
  let item = list.at(idx);
  let cacNut = ["A", "B", "C", "D"];
  
  cacNut.forEach(chu => {
    let nut = document.getElementById("btn" + chu);
    nut.disabled = true;
    if (chu === item.dung) nut.classList.add("ok");
    else if (chu === chon) nut.classList.add("no");
  });

  if (chon === item.dung) score++;
  document.getElementById("pts").innerText = "Điểm: " + score;
  document.getElementById("nxt").style.display = "inline-block";
}

function next() {
  idx++;
  if (idx < list.length) show();
  else document.getElementById("app").innerHTML = `<h2>🎉 Hoàn thành Phần 1!</h2><p style="font-size:22px">Điểm của bạn: <b>${score}/${list.length}</b></p><button class="btn" onclick="location.reload()">Làm lại</button>`;
}

function mix() {
  list = data.slice().sort(() => Math.random() - 0.5);
  idx = 0; score = 0; show();
}

show();
</script>
